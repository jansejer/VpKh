<script>const SEED={"afdelinger": [{"id": "VS", "navn": "VS", "stuer": [], "dagtekster": ["", "", "", "", "", "", "", ""]}, {"id": "BH", "navn": "BH", "stuer": [], "dagtekster": ["", "", "", "", "", "", "", ""]}], "personer": []};</script>
<script>'use strict';
/* ===================== KERNE (ingen DOM) ===================== */
const DAGE = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag 1', 'Fredag 2', 'Fredag 3', 'Fredag 4'];
const DAG_KORT = ['Man', 'Tirs', 'Ons', 'Tors', 'Fre 1', 'Fre 2', 'Fre 3', 'Fre 4'];
const UGEDAGE = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
const SLOT_FRA = 390, SLOT_TIL = 990, SLOT_TRIN = 30;   // dækningsvisning 6.30 - 16.30
const MIN_HVILE = 660;                                  // 11 timers hvile mellem vagter

/* ---------- tid ---------- */
function fmtT(m) { return Math.floor(m / 60) + '.' + String(m % 60).padStart(2, '0'); }
function fmtVagt(s, e) { return fmtT(s) + '-' + fmtT(e); }
function fmtDiff(m) { const sg = m < 0 ? '-' : ''; m = Math.abs(Math.round(m)); return sg + Math.floor(m / 60) + '.' + String(m % 60).padStart(2, '0'); }

/* returnerer minutter, eller null hvis ugyldig */
function parseTid(str) {
    let s = String(str).trim().replace(/,/g, ':').replace(/\./g, ':');
    if (!s) return null;
    let h, m = 0;
    if (s.includes(':')) {
        const p = s.split(':');
        if (p.length !== 2 || !/^\d{1,2}$/.test(p[0]) || !/^\d{1,2}$/.test(p[1])) return null;
        h = +p[0]; m = p[1].length === 1 ? +p[1] * 10 : +p[1];
    } else if (/^\d{1,2}$/.test(s)) { h = +s; }
    else if (/^\d{3,4}$/.test(s)) { const n = +s; h = Math.floor(n / 100); m = n % 100; }
    else return null;
    if (h > 23 || m > 59) return null;
    return h * 60 + m;
}

/* "7.30-15.15" / "7.30 15.15" / "tom" -> {empty:true} | {s,e} | {err} */
function parseVagt(str) {
    const t = String(str == null ? '' : str).trim().replace(/[–—]/g, '-');
    if (!t) return { empty: true };
    let parts;
    if (t.includes('-')) parts = t.split('-').map(x => x.trim()); else parts = t.split(/\s+/);
    if (parts.length !== 2) return { err: 'Skriv vagten som start-slut, fx 7.30-15.15' };
    const s = parseTid(parts[0]), e = parseTid(parts[1]);
    if (s == null || e == null) return { err: 'Ugyldig tid. Skriv fx 7.30-15.15' };
    if (e <= s) return { err: 'Slut skal være efter start' };
    return { s, e };
}

/* ---------- datoer (UTC, uden tidszoneproblemer) ---------- */
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function fmtISO(dt) { return dt.toISOString().slice(0, 10); }
function addDays(iso, n) { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return fmtISO(d); }
function weekdayIdx(iso) { return (parseISO(iso).getUTCDay() + 6) % 7; }       // man = 0
function mondayOf(iso) { return addDays(iso, -weekdayIdx(iso)); }
function fmtDK(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
function rotWeek(S, mondayIso) {
    const diff = Math.round((parseISO(mondayIso) - parseISO(mondayOf(S.startDato))) / (7 * 864e5));
    return ((diff % 4) + 4) % 4;
}
function dagIdxFor(S, iso) {
    const w = weekdayIdx(iso);
    if (w >= 5) return null;
    return w < 4 ? w : 4 + rotWeek(S, mondayOf(iso));
}

/* ---------- personer ---------- */
function personTotals(p) {
    let mt = 0, fr = 0, has = false;
    for (let d = 0; d < 8; d++) {
        if (p.start[d] != null) { const m = p.slut[d] - p.start[d]; if (d < 4) mt += m; else fr += m; has = true; }
    }
    const total = 4 * mt + fr, norm = Math.round((p.timer || 0) * 240);
    return { mt, fr, total, norm, diff: norm - total, fremaal: norm - 4 * mt, has };
}
function getBase(p, d) { return p.start[d] != null ? [p.start[d], p.slut[d]] : null; }

function unikVagter(S, afd) {
    const set = new Set();
    for (const p of S.personer) if (p.afd === afd) for (let d = 0; d < 8; d++) if (p.start[d] != null) set.add(p.start[d] * 10000 + p.slut[d]);
    return [...set].sort((a, b) => a - b).map(k => [Math.floor(k / 10000), k % 10000]);
}

/* ---------- hensyn ---------- */
const hAppliesDay = (h, d) => !h.dage || h.dage.includes(d);
const hBad = (h, s, e) => h.type === 'fridag' ? true : h.type === 'ikke_foer' ? s < h.min : h.type === 'ikke_efter' ? e > h.min : false;
/* grundplan: kun hensyn uden datoer, pr. kolonne d (0-7) */
function ruleViolations(S, p, d, s, e) {
    const out = { hard: [], soft: [] };
    for (const h of S.hensyn.person) {
        if (h.personId !== p.id || h.fra || !hAppliesDay(h, d)) continue;
        if (hBad(h, s, e)) (h.hard === 'skal' ? out.hard : out.soft).push(h);
    }
    return out;
}
/* ugeplan: både hensyn uden datoer (via rotationsdag di) og hensyn med datoer */
function ruleViolationsDate(S, p, iso, di, s, e) {
    const out = { hard: [], soft: [] };
    for (const h of S.hensyn.person) {
        if (h.personId !== p.id) continue;
        if (h.fra) {
            if (iso < h.fra || iso > (h.til || h.fra)) continue;
            const wd = weekdayIdx(iso);
            if (h.dage && !(wd < 4 ? h.dage.includes(wd) : h.dage.some(x => x >= 4))) continue;
        } else if (di == null || !hAppliesDay(h, di)) continue;
        if (hBad(h, s, e)) (h.hard === 'skal' ? out.hard : out.soft).push(h);
    }
    return out;
}
function hensynKort(S, h) {
    let t = '';
    if (h.type === 'ikke_foer') t = 'kan ikke starte før ' + fmtT(h.min);
    else if (h.type === 'ikke_efter') t = 'kan ikke arbejde efter ' + fmtT(h.min);
    else if (h.type === 'fridag') t = 'fri';
    if (h.dage && h.dage.length < 8 && !(h.fra && h.dage.length === 5)) t += (h.type === 'fridag' ? ' ' : ' (') + dageTekst(h.dage) + (h.type === 'fridag' ? '' : ')');
    else if (h.type === 'fridag') t += ' alle dage';
    if (h.fra) t += ' · ' + (h.til && h.til !== h.fra ? fmtDK(h.fra) + '–' + fmtDK(h.til) : fmtDK(h.fra));
    if (h.note) t += ' – ' + h.note;
    return t;
}
function hensynTekst(S, h) {
    const p = S.personer.find(x => x.id === h.personId);
    return (p ? p.navn : '(slettet person)') + ': ' + hensynKort(S, h);
}
function dageTekst(dage) {
    const s = [...dage].sort((a, b) => a - b);
    if (s.length === 4 && s.join() === '4,5,6,7') return 'alle fredage';
    return s.map(d => DAGE[d].toLowerCase()).join(', ');
}
function memberOf(rule, p) {
    return p.afd === rule.afd && (!rule.stue || p.stue === rule.stue) && (!rule.kval || p.kval === rule.kval);
}
const ALLE_DAGE = [0, 1, 2, 3, 4, 5, 6, 7];
function ruleDage(rule) { return rule.dage || ALLE_DAGE; }
function ruleSlots(rule) { const a = []; for (let m = rule.fra; m < rule.til; m += SLOT_TRIN) a.push(m); return a; }
function bemandingTekst(rule) {
    const dg = ruleDage(rule), alle = dg.length === 8, mt = dg.length === 4 && dg.join() === '0,1,2,3';
    return (rule.stue || 'Hele afdelingen ' + rule.afd) + ' ' + fmtT(rule.fra) + '-' + fmtT(rule.til) + ': mindst ' + rule.min + (rule.kval ? ' ' + rule.kval.toLowerCase() : '') + (alle ? '' : ' (' + (mt ? 'man-tors' : dageTekst(dg)) + ')');
}

/* items: [{label, get:(p)=>[s,e]|null}] -> sammenhængende huller */
function coverageIssues(S, afd, items) {
    const issues = [];
    for (const rule of S.hensyn.bemanding) {
        if (rule.afd !== afd) continue;
        const mem = S.personer.filter(p => memberOf(rule, p));
        const slots = ruleSlots(rule);
        const dg = ruleDage(rule);
        items.forEach((it, di) => {
            if (items.length === 8 && !dg.includes(di)) return;
            if (items.length !== 8 && !dg.includes(it.dagIdx)) return;
            let cur = null;
            for (const m of slots) {
                let cnt = 0;
                for (const p of mem) { const sh = it.get(p); if (sh && sh[0] <= m && m < sh[1]) cnt++; }
                if (cnt < rule.min) {
                    if (cur && cur.to === m) { cur.to = m + SLOT_TRIN; cur.worst = Math.min(cur.worst, cnt); }
                    else { cur = { rule, day: di, label: it.label, from: m, to: m + SLOT_TRIN, worst: cnt }; issues.push(cur); }
                } else cur = null;
            }
        });
    }
    return issues;
}
function issueTekst(is) {
    return is.label + ' · ' + (is.rule.stue || 'Hele afdelingen') + ' ' + fmtT(is.from) + '-' + fmtT(is.to) + ': ' + is.worst + ' af ' + is.rule.min + (is.rule.kval ? ' ' + is.rule.kval.toLowerCase() : '') + (is.rule.hard === 'skal' ? '' : ' (gerne)');
}
function baseItems() { return DAGE.map((n, d) => ({ label: n, get: p => getBase(p, d) })); }

/* matrix til dækningsvisning: stue='' = hele afdelingen */
function coverageMatrix(S, afd, stue, items) {
    const mem = S.personer.filter(p => p.afd === afd && (!stue || p.stue === stue));
    const rows = [];
    for (let m = SLOT_FRA; m <= SLOT_TIL; m += SLOT_TRIN) {
        const krav = items.map((it, di) => { let k = 0; const dd = items.length === 8 ? di : it.dagIdx;
            for (const r of S.hensyn.bemanding) {
                if (r.afd !== afd || (r.stue || '') !== (stue || '') || r.kval || !ruleDage(r).includes(dd)) continue;
                if (m >= r.fra && m < r.til && r.min > k) k = r.min;
            } return k; });
        const counts = items.map(it => { let c = 0; for (const p of mem) { const sh = it.get(p); if (sh && sh[0] <= m && m < sh[1]) c++; } return c; });
        rows.push({ m, krav, counts });
    }
    return rows;
}

/* ---------- ugeplan ---------- */
function findAbs(S, pid, iso) {
    for (const f of S.fravaer) if (f.personId === pid && f.fra <= iso && iso <= f.til) return f;
    return null;
}
function effInfo(S, p, iso) {
    const di = dagIdxFor(S, iso);
    const base = di == null ? null : getBase(p, di);
    const ovd = S.overstyr[iso];
    const ov = ovd && Object.prototype.hasOwnProperty.call(ovd, p.id) ? ovd[p.id] : undefined;
    const ab = findAbs(S, p.id, iso);
    let shift = base, over = false;
    if (ov !== undefined) { shift = ov ? [ov.s, ov.e] : null; over = true; }
    const need = shift;           // det der ville være arbejdet hvis ikke fraværende
    if (ab) shift = null;
    return { shift, need, base, over, abs: ab, di };
}
function weekMinutes(S, p, monday) {
    let t = 0;
    for (let k = 0; k < 5; k++) { const i = effInfo(S, p, addDays(monday, k)); if (i.need) t += i.need[1] - i.need[0]; }
    return t;
}
function weekItems(S, monday) {
    return [0, 1, 2, 3, 4].map(k => { const iso = addDays(monday, k); return { label: UGEDAGE[k] + ' ' + fmtDK(iso), iso, dagIdx: k < 4 ? k : (dagIdxFor(S, iso)), get: p => effInfo(S, p, iso).shift }; });
}

function findAfloeser(S, absentP, iso) {
    const info = effInfo(S, absentP, iso);
    const need = info.need;
    if (!need) return { need: null, list: [] };
    const di = dagIdxFor(S, iso), monday = mondayOf(iso), dur = need[1] - need[0];
    const list = [];
    for (const q of S.personer) {
        if (q.id === absentP.id || !(q.timer > 0) || q.auto === false || q.afd !== absentP.afd) continue;
        const qi = effInfo(S, q, iso);
        if (qi.abs || qi.shift) continue;
        const v = ruleViolationsDate(S, q, iso, di, need[0], need[1]);
        if (v.hard.length) continue;
        // 11 timers hvile
        const pd = effInfo(S, q, addDays(iso, -1)).shift, nd = effInfo(S, q, addDays(iso, 1)).shift;
        if (weekdayIdx(iso) > 0 && pd && need[0] + 1440 - pd[1] < MIN_HVILE) continue;
        if (weekdayIdx(iso) < 4 && nd && nd[0] + 1440 - need[1] < MIN_HVILE) continue;
        const wk = weekMinutes(S, q, monday), norm = Math.round(q.timer * 60);
        const owed = norm - wk, after = wk + dur, over = Math.max(0, after - norm);
        let score = Math.min(Math.max(owed, 0), dur) / 3 - over / 3 + (q.stue === absentP.stue ? 25 : 0) + (q.afd === absentP.afd ? 15 : 0)
            + (absentP.kval && q.kval === absentP.kval ? 10 : 0) - 40 * v.soft.length;
        const why = [];

/* ---------- automatisk gem i OneDrive (Microsoft Graph, app-mappe) ---------- */
const CFG = (typeof window.VAGTPLAN_CONFIG === 'object' && window.VAGTPLAN_CONFIG) || {};
const MS = { authority: CFG.authority || 'https://login.microsoftonline.com/common/oauth2/v2.0', graph: CFG.graphBase || 'https://graph.microsoft.com/v1.0', scope: 'Files.ReadWrite.AppFolder offline_access' };
const OD = { ok: false, lastSaved: null, lastSeen: '', timer: null, busy: false, err: null, needLogin: false, offline: false };
function odAvailable() { return location.protocol.indexOf('http') === 0; }
function odClientId() { return CFG.clientId || localStorage.getItem('vagtplan_msid') || ''; }
function odRedirect() { return new URL('index.html', document.baseURI).href; }
function odStored() { try { return JSON.parse(localStorage.getItem('vagtplan_ms') || 'null'); } catch (e) { return null; } }
function b64url(arr) { let s = ''; new Uint8Array(arr).forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function odLogin() {
    const id = odClientId();
    if (!id) { toast('Skriv f\u00f8rst program-id (client id) fra Microsoft', true); return; }
    const ver = b64url(crypto.getRandomValues(new Uint8Array(48))), state = b64url(crypto.getRandomValues(new Uint8Array(16)));
    const chal = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ver)));
    localStorage.setItem('vagtplan_pkce', JSON.stringify({ ver, state, t: Date.now() }));
    const p = new URLSearchParams({ client_id: id, response_type: 'code', redirect_uri: odRedirect(), response_mode: 'query', scope: MS.scope, state, code_challenge: chal, code_challenge_method: 'S256' });
    location.href = MS.authority + '/authorize?' + p.toString();
}
async function odTokenCall(params) {
    const r = await fetch(MS.authority + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(params).toString() });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.access_token) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));
    const prev = odStored() || {};
    localStorage.setItem('vagtplan_ms', JSON.stringify({ access: j.access_token, refresh: j.refresh_token || prev.refresh, exp: Date.now() + (j.expires_in || 3600) * 1000 - 120000 }));
}
async function odHandleRedirect() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return false;
    const clean = () => { try { history.replaceState({}, '', odRedirect()); } catch (e) { } };
    if (q.has('error')) { toast('Microsoft-login mislykkedes: ' + (q.get('error_description') || q.get('error')), true); clean(); return true; }
    let pk = null; try { pk = JSON.parse(localStorage.getItem('vagtplan_pkce') || 'null'); } catch (e) { }
    localStorage.removeItem('vagtplan_pkce'); clean();
    if (!pk || pk.state !== q.get('state')) { toast('Login kunne ikke bekr\u00e6ftes. Pr\u00f8v igen.', true); return true; }
    try {
        await odTokenCall({ client_id: odClientId(), scope: MS.scope, code: q.get('code'), redirect_uri: odRedirect(), grant_type: 'authorization_code', code_verifier: pk.ver });
        OD.ok = true; OD.needLogin = false; toast('Forbundet til OneDrive');
        await odCheckNewer(); await odWrite(true);
    } catch (e) { OD.err = String(e.message || e); toast('Login mislykkedes: ' + OD.err, true); }
    return true;
}
async function odToken() {
    const s = odStored(); if (!s) return null;
    if (s.access && Date.now() < s.exp) return s.access;
    if (!s.refresh) { OD.needLogin = true; return null; }
    try {
        await odTokenCall({ client_id: odClientId(), scope: MS.scope, refresh_token: s.refresh, grant_type: 'refresh_token' });
        return odStored().access;
    } catch (e) {
        if (e instanceof TypeError) throw e;           // netv\u00e6rksfejl: pr\u00f8v igen senere
        OD.needLogin = true; OD.ok = false; return null;
    }
}
async function odFile(method, body) {
    const t = await odToken(); if (!t) throw new Error('login');
    const hdr = { Authorization: 'Bearer ' + t }; if (body != null) hdr['Content-Type'] = 'application/json';
    return fetch(MS.graph + '/me/drive/special/approot:/vagtplan-data.json:/content', { method, headers: hdr, body });
}
async function odRead() {
    const r = await odFile('GET');
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('OneDrive svarede ' + r.status);

}
async function odCheckNewer() {
    const x = await odRead(); if (!x) return;
    const fT = (x.meta && x.meta.savedAt) || '', mine = (S.meta && S.meta.savedAt) || '';
    OD.lastSeen = fT;
    if (fT && fT > mine && confirm('Filen i OneDrive er nyere (gemt ' + fmtStempel(fT) + ') end data p\u00e5 denne enhed' + (mine ? ' (gemt ' + fmtStempel(mine) + ')' : '') + '.\n\nOK = indl\u00e6s data fra OneDrive\nAnnuller = behold data p\u00e5 denne enhed (OneDrive bliver overskrevet)')) {
        S = x; if (!S.meta) S.meta = {}; migrer(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } render();
    }
}
function odSchedule() { if (!OD.ok) return; clearTimeout(OD.timer); OD.timer = setTimeout(() => odWrite(false), 1500); }
async function odWrite(force) {
    if (!OD.ok || OD.busy) return;
    OD.busy = true;
    try {
        if (!force) {
            const cur = await odRead(); const ct = cur && cur.meta && cur.meta.savedAt || '';
            if (ct && ct > OD.lastSeen) {
                if (!confirm('Filen i OneDrive er \u00e6ndret et andet sted (gemt ' + fmtStempel(ct) + ') siden du sidst gemte.\n\nOK = overskriv OneDrive med dine data\nAnnuller = indl\u00e6s filens data i stedet (dine seneste \u00e6ndringer her g\u00e5r tabt)')) {
                    S = cur; migrer(); OD.lastSeen = ct; localStorage.setItem(KEY, JSON.stringify(S)); OD.busy = false; render(); return;
                }
            }

        S.meta.savedAt = new Date().toISOString();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
        const r = await odFile('PUT', JSON.stringify(S));
        if (!r.ok) throw new Error('OneDrive svarede ' + r.status);
        OD.lastSeen = S.meta.savedAt; OD.lastSaved = new Date(); OD.err = null; OD.offline = false;
    } catch (e) {
        if (e instanceof TypeError) { OD.offline = true; OD.err = 'ingen forbindelse'; }
        else if (String(e.message) === 'login') { OD.needLogin = true; OD.ok = false; }
        else OD.err = String(e.message || e);
    }
    OD.busy = false; updateHeader();
}
async function odInit() {
    if (!odAvailable()) return;
    await odHandleRedirect();

    if (r.empty) { p.start[d] = null; p.slut[d] = null; } else { p.start[d] = r.s; p.slut[d] = r.e; }
    if (p.forslag) p.forslag[d] = false;

}
function gridKey(e) {
    const inp = e.target; if (!inp.classList || !inp.classList.contains('cell')) return;
    const keyMove = { Enter: 1, ArrowDown: 1, ArrowUp: -1 }[e.key]; if (!keyMove) return;
    e.preventDefault(); inp.blur();
    const col = $$('#grid input.cell[data-d="' + inp.dataset.d + '"]'); const i = col.indexOf(inp);
    const nx = col[i + (e.key === 'Enter' && e.shiftKey ? -1 : keyMove)]; if (nx) { nx.focus(); nx.select(); }
}

function goAuto(mode) {

        snapshot();

        h += '<h4>Stuer i ' + esc(a.navn) + '</h4><div class="form">' + a.stuer.map((s, i) => '<span class="chip"><input data-chg="stue" data-a="' + a.id + '" data-i="' + i + '" value="' + esc(s) + '"><button class="btn sm" data-act="stue-del" data-a="' + a.id + '" data-i="' + i + '">×</button></span>').join('') + '<input id="ns-' + a.id + '" placeholder="Ny stue"><button class="btn sm" data-act="stue-add" data-a="' + a.id + '">Tilføj stue</button></div>';

    return h;
}

/* ================= HÆNDELSER ================= */
function act(a, t) {
    const d = t.dataset;
    switch (a) {
        case 'tab': UI.tab = d.k; render(); break;
        case 'od-login': odLogin(); break;
        case 'od-logout': odLogout(); break;
        case 'od-write': odWrite(true).then(() => toast(OD.err ? 'Fejl: ' + OD.err : 'Gemt til OneDrive')); break;
        case 'bk-share': {
            const f = new File([JSON.stringify(S)], 'vagtplan-backup-' + todayISO() + '.json', { type: 'application/json' });
            if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Vagtplan-backup' }).then(() => { S.meta.sidstBackup = new Date().toISOString(); commit(); updateHeader(); }).catch(() => { }); }
            else { download(f.name, JSON.stringify(S)); S.meta.sidstBackup = new Date().toISOString(); commit(); updateHeader(); }
            break;
        }

        case 'fs-stop': fsStop(); break;

        case 'close': closeModal(); break;
        case 'print': document.body.classList.add('print-grid'); window.print(); setTimeout(() => document.body.classList.remove('print-grid'), 1500); break;
        case 'print-alt': window.print(); break;
        case 'auto-rest': runAuto('rest'); break;
        case 'auto-fre': runAuto('fredage'); break;
        case 'auto-go': goAuto(d.mode); break;
        case 'godkend': snapshot(); S.personer.filter(p => p.afd === UI.afd).forEach(p => p.forslag = Array(8).fill(false)); commit(); updateGrid(); toast('Forslag godkendt'); break;
        case 'fjernforslag': {
            snapshot(); let n = 0;
            S.personer.filter(p => p.afd === UI.afd).forEach(p => { for (let k = 0; k < 8; k++) if (p.forslag && p.forslag[k]) { p.start[k] = null; p.slut[k] = null; p.forslag[k] = false; n++; } });
            commit(); updateGrid(); toast(n + ' forslag fjernet'); break;
        }
        case 'csv': download('vagtplan-' + UI.afd + '.csv', '\ufeff' + csvEksport(S, UI.afd), 'text/csv'); break;
        case 'csv-all': S.afdelinger.forEach(x => download('vagtplan-' + x.id + '.csv', '\ufeff' + csvEksport(S, x.id), 'text/csv')); break;
        case 'wk': UI.week = d.n === '0' ? mondayOf(todayISO()) : addDays(UI.week, 7 * +d.n); render(); break;
        case 'cell': cellDialog(d.p, d.iso); break;
        case 'afl': aflDialog(d.p, d.iso); break;
        case 'afl-brug': {
            const q = S.personer.find(x => x.id === d.q), p = S.personer.find(x => x.id === d.p), r = findAfloeser(S, p, d.iso);
            snapshot(); (S.overstyr[d.iso] = S.overstyr[d.iso] || {})[q.id] = { s: r.need[0], e: r.need[1] };
            logg(q.navn + ' dækker ' + p.navn + ' ' + fmtDK(d.iso) + ' ' + fmtVagt(r.need[0], r.need[1])); commit(); closeModal(); render(); toast(q.navn + ' sat ind ' + fmtDK(d.iso)); break;
        }
        case 'cd-fv': {
            const til = $('#cdTil').value || d.iso; snapshot(); S.fravaer.push({ id: nyId(S, 'f'), personId: d.p, fra: d.iso, til: til < d.iso ? d.iso : til, type: $('#cdT').value });
            const p = S.personer.find(x => x.id === d.p); logg(p.navn + ': ' + $('#cdT').value + ' ' + fmtDK(d.iso) + (til !== d.iso ? '–' + fmtDK(til) : '')); commit(); render(); aflDialog(d.p, d.iso); break;
        }
        case 'cd-set': {
            const r = parseVagt($('#cdV').value); if (r.err || r.empty) { toast(r.err || 'Skriv en vagt, fx 7.30-15.15', true); break; }
            snapshot(); (S.overstyr[d.iso] = S.overstyr[d.iso] || {})[d.p] = { s: r.s, e: r.e };
            logg(S.personer.find(x => x.id === d.p).navn + ' ' + fmtDK(d.iso) + ' ændret til ' + fmtVagt(r.s, r.e)); commit(); closeModal(); render(); break;
        }
        case 'cd-fri': snapshot(); (S.overstyr[d.iso] = S.overstyr[d.iso] || {})[d.p] = null; logg(S.personer.find(x => x.id === d.p).navn + ' ' + fmtDK(d.iso) + ' sat fri'); commit(); closeModal(); render(); break;
        case 'cd-reset': snapshot(); if (S.overstyr[d.iso]) { delete S.overstyr[d.iso][d.p]; if (!Object.keys(S.overstyr[d.iso]).length) delete S.overstyr[d.iso]; } commit(); closeModal(); render(); break;
        case 'fv-add': {
            const f = $('#fvF').value, ti = $('#fvTil').value; if (!f || !ti) { toast('Vælg fra- og til-dato', true); break; }
            snapshot(); S.fravaer.push({ id: nyId(S, 'f'), personId: $('#fvP').value, fra: f, til: ti < f ? f : ti, type: $('#fvT').value });
            logg(S.personer.find(x => x.id === $('#fvP').value).navn + ': ' + $('#fvT').value + ' ' + fmtDK(f) + '–' + fmtDK(ti)); commit(); render(); break;
        }
        case 'fv-del': snapshot(); S.fravaer = S.fravaer.filter(x => x.id !== d.id); commit(); if (d.close) closeModal(); render(); break;
        case 'hp-add': {
            const typ = $('#hpT').value, x = { id: nyId(S, 'h'), personId: $('#hpP').value, type: typ, hard: $('#hpH').value };
            x.dage = $$('#hpD input.hpd:checked').flatMap(c => c.value === 'fre' ? [4, 5, 6, 7] : [+c.value]);
            if (!x.dage.length) { toast('Vælg mindst én dag', true); break; }
            if (typ !== 'fridag') { const m = parseTid($('#hpTid').value); if (m == null) { toast('Ugyldig tid – skriv fx 8.00', true); break; } x.min = m; }
            const fra = $('#hpFra').value, til = $('#hpTil').value;
            if (fra) { x.fra = fra; x.til = til && til >= fra ? til : fra; }
            else if (til) { toast('Skriv også en fra-dato', true); break; }
            const nt = $('#hpN').value.trim(); if (nt) x.note = nt;
            snapshot(); S.hensyn.person.push(x); commit(); render(); toast('Hensyn tilføjet'); break;
        }
        case 'hp-del': snapshot(); S.hensyn.person = S.hensyn.person.filter(x => x.id !== d.id); commit(); render(); break;
        case 'hb-add': {
            const fra = parseTid($('#hbF').value), til = parseTid($('#hbT').value), mn = +$('#hbM').value;
            if (fra == null || til == null || til <= fra || !(mn >= 1)) { toast('Tjek tidspunkter og antal', true); break; }
            const dk = $('#hbD').value; snapshot();
            S.hensyn.bemanding.push({ id: nyId(S, 'b'), afd: $('#hbA').value, stue: $('#hbS').value, fra, til, min: mn, kval: $('#hbK').value, hard: $('#hbH').value, dage: dk === 'mt' ? [0, 1, 2, 3] : dk === 'fre' ? [4, 5, 6, 7] : [0, 1, 2, 3, 4, 5, 6, 7] });
            commit(); render(); break;
        }
        case 'hb-del': snapshot(); S.hensyn.bemanding = S.hensyn.bemanding.filter(x => x.id !== d.id); commit(); render(); break;
        case 'p-add': {
            const n = $('#np-n-' + d.a).value.trim(), st = $('#np-s-' + d.a).value, ti = parseFloat($('#np-t-' + d.a).value.replace(',', '.'));
            if (!n || !(ti > 0)) { toast('Skriv navn og timer pr. uge', true); break; }
            snapshot(); S.personer.push({ id: nyId(S, 'p'), navn: n, afd: d.a, stue: st, timer: ti, note: '', kval: '', auto: true, start: Array(8).fill(null), slut: Array(8).fill(null), forslag: Array(8).fill(false) });
            commit(); render(); toast(n + ' tilføjet – udfyld vagter i Grundplan'); break;
        }
        case 'p-del': {
            const p = S.personer.find(x => x.id === d.p); if (!confirm('Fjern ' + p.navn + ' fra planen? Det kan fortrydes med Fortryd-knappen.')) break;
            snapshot(); S.personer = S.personer.filter(x => x.id !== d.p); S.hensyn.person = S.hensyn.person.filter(x => x.personId !== d.p); S.fravaer = S.fravaer.filter(x => x.personId !== d.p); commit(); render(); break;
        }
        case 'p-up': case 'p-dn': {
            const i = S.personer.findIndex(x => x.id === d.p), p = S.personer[i]; const dir = a === 'p-up' ? -1 : 1;
            let j = i + dir; while (j >= 0 && j < S.personer.length && (S.personer[j].afd !== p.afd || S.personer[j].stue !== p.stue)) j += dir;
            if (j < 0 || j >= S.personer.length) break; snapshot(); S.personer.splice(i, 1); S.personer.splice(j, 0, p); commit(); render(); break;
        }
        case 'stue-add': {
            const n = $('#ns-' + d.a).value.trim(); if (!n) break; const a = afdObj(d.a); if (a.stuer.includes(n)) { toast('Stuen findes allerede', true); break; }
            snapshot(); a.stuer.push(n); commit(); render(); break;
        }
        case 'stue-del': {
            const a = afdObj(d.a), s = a.stuer[+d.i]; if (S.personer.some(p => p.afd === a.id && p.stue === s)) { toast('Flyt eller slet først personerne i ' + s, true); break; }
            snapshot(); a.stuer.splice(+d.i, 1); S.hensyn.bemanding = S.hensyn.bemanding.filter(r => !(r.afd === a.id && r.stue === s)); commit(); render(); break;
        }
        case 'bk-save': download('vagtplan-backup-' + todayISO() + '.json', JSON.stringify(S)); S.meta.sidstBackup = new Date().toISOString(); commit(); render(); toast('Backup gemt som fil i din Overførsler-mappe'); break;
        case 'bk-reset': if (confirm('Nulstil alt til startdata? Dine ændringer forsvinder (tag evt. backup først).')) { snapshot(); S = defaultState(); commit(); render(); } break;
    }
}
function chg(k, t) {
    const d = t.dataset;
    switch (k) {
        case 'cell': onCell(t); break;
        case 'weekpick': if (t.value) { UI.week = mondayOf(t.value); render(); } break;
        case 'start': if (t.value) { snapshot(); S.startDato = t.value; commit(); toast('Gemt'); } break;
        case 'msid': localStorage.setItem('vagtplan_msid', t.value.trim()); toast('Program-id gemt'); break;
        case 'htekst': S.hensynTekst = t.value; commit(); break;
        case 'indst': {
            const a = [], l = []; let bad = false;
            for (let i = 0; i < 5; i++) { const x = parseTid($('#iA' + i).value), y = parseTid($('#iL' + i).value); if (x == null || y == null || y <= x) bad = true; a.push(x); l.push(y); }
            if (bad) { toast('Ugyldig åbningstid – skriv fx 6.20 og 17.00, og lukketid efter åbningstid', true); render(); break; }
            snapshot(); S.indst = { aabner: a, lukker: l }; commit(); toast('Åbningstider gemt'); break;
        }
        case 'hpT': {
            const v = t.value; $('#hpV').innerHTML = v === 'fridag' ? '' : '<input id="hpTid" value="' + (v === 'ikke_foer' ? '8.00' : '15.00') + '" style="width:5em">';
            $$('#hpD input.hpd').forEach(c => { c.checked = v !== 'fridag'; }); break;
        }
        case 'hbA': UI.hAfd = t.value; render(); break;
        case 'pf': {
            const p = S.personer.find(x => x.id === d.p), f = d.f; snapshot();
            if (f === 'timer') { const v = parseFloat(String(t.value).replace(',', '.')); if (!(v >= 0)) { toast('Ugyldigt timetal', true); render(); return; } p.timer = v; }
            else if (f === 'auto') p.auto = t.checked; else p[f] = t.value.trim ? t.value.trim() : t.value;
            commit(); if (f === 'stue' || f === 'navn') render(); break;
        }
        case 'stue': {
            const a = afdObj(d.a), old = a.stuer[+d.i], nw = t.value.trim(); if (!nw || (nw !== old && a.stuer.includes(nw))) { toast('Ugyldigt eller dobbelt stuenavn', true); render(); return; }
            snapshot(); a.stuer[+d.i] = nw; S.personer.forEach(p => { if (p.afd === a.id && p.stue === old) p.stue = nw; }); S.hensyn.bemanding.forEach(r => { if (r.afd === a.id && r.stue === old) r.stue = nw; }); commit(); render(); break;
        }
        case 'dtekst': snapshot(); afdObj(d.a).dagtekster[+d.i] = t.value; commit(); break;
        case 'bkfile': {
            const f = t.files[0]; if (!f) return; const rd = new FileReader();
            rd.onload = () => { try { const x = JSON.parse(rd.result); if (!x.personer || !x.afdelinger) throw 0; snapshot(); S = x; commit(); render(); toast('Backup indlæst'); } catch (e) { toast('Filen ligner ikke en vagtplan-backup', true); } };
            rd.readAsText(f); break;
        }
    }
}

function init() {
    load(); migrer();
    const main = $('#main');
    document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t) { act(t.dataset.act, t, e); } });
    document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.chg) chg(t.dataset.chg, t, e); });
    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !(e.target.tagName === 'TEXTAREA')) { e.preventDefault(); undo(); return; }
        if (e.key === 'Escape') closeModal();
        gridKey(e);
    });
    $('#btnUndo').addEventListener('click', undo);
    $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    $('#details-toggle') && 0;
    document.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.k) UI.open[d.dataset.k] = d.open; }, true);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    render();
    fsInit();
    odInit();
    document.addEventListener('visibilitychange', () => { if (document.hidden && FS.handle && FS.ok) { clearTimeout(FS.timer); fsWrite(false); } });
}
document.addEventListener('DOMContentLoaded', init);
