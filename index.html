<script>'use strict';
/* ===================== KERNE (ingen DOM) ===================== */
const DAGE = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag 1', 'Fredag 2', 'Fredag 3', 'Fredag 4'];
const DAG_KORT = ['Man', 'Tirs', 'Ons', 'Tors', 'Fre 1', 'Fre 2', 'Fre 3', 'Fre 4'];
const UGEDAGE = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
const SLOT_FRA = 390, SLOT_TIL = 990, SLOT_TRIN = 30;   // dækningsvisning 6.30 - 16.30
const MIN_HVILE = 660;                                  // 11 timers hvile mellem vagter

/* ---------- tid ---------- */
function fmtT(m) { return Math.floor(m / 60) + '.' + String(m % 60).padStart(2, '0'); }
function fmtVagt(s, e) { return fmtT(s) + '-' + fmtT(e); }
function fmtDiff(m) { const sg = m < 0 ? '-' : ''; m = Math.abs(Math.round(m)); return sg + Math.floor(m / 60) + '.' + String(m % 60).padStart(2, '0'); }

/* returnerer minutter, eller null hvis ugyldig */
function parseTid(str) {
    let s = String(str).trim().replace(/,/g, ':').replace(/\./g, ':');
    if (!s) return null;
    let h, m = 0;
    if (s.includes(':')) {
        const p = s.split(':');
        if (p.length !== 2 || !/^\d{1,2}$/.test(p[0]) || !/^\d{1,2}$/.test(p[1])) return null;
        h = +p[0]; m = p[1].length === 1 ? +p[1] * 10 : +p[1];
    } else if (/^\d{1,2}$/.test(s)) { h = +s; }
    else if (/^\d{3,4}$/.test(s)) { const n = +s; h = Math.floor(n / 100); m = n % 100; }
    else return null;
    if (h > 23 || m > 59) return null;
    return h * 60 + m;
}

/* "7.30-15.15" / "7.30 15.15" / "tom" -> {empty:true} | {s,e} | {err} */
function parseVagt(str) {
    const t = String(str == null ? '' : str).trim().replace(/[–—]/g, '-');
    if (!t) return { empty: true };
    let parts;
    if (t.includes('-')) parts = t.split('-').map(x => x.trim()); else parts = t.split(/\s+/);
    if (parts.length !== 2) return { err: 'Skriv vagten som start-slut, fx 7.30-15.15' };
    const s = parseTid(parts[0]), e = parseTid(parts[1]);
    if (s == null || e == null) return { err: 'Ugyldig tid. Skriv fx 7.30-15.15' };
    if (e <= s) return { err: 'Slut skal være efter start' };
    return { s, e };
}

/* ---------- datoer (UTC, uden tidszoneproblemer) ---------- */
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function fmtISO(dt) { return dt.toISOString().slice(0, 10); }
function addDays(iso, n) { const d = parseISO(iso); d.setUTCDate(d.getUTCDate() + n); return fmtISO(d); }
function weekdayIdx(iso) { return (parseISO(iso).getUTCDay() + 6) % 7; }       // man = 0
function mondayOf(iso) { return addDays(iso, -weekdayIdx(iso)); }
function fmtDK(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
function rotWeekStart(startDato, mondayIso) {
    const diff = Math.round((parseISO(mondayIso) - parseISO(mondayOf(startDato))) / (7 * 864e5));
    return ((diff % 4) + 4) % 4;
}
function rotWeek(S, mondayIso) { return rotWeekStart(S.startDato, mondayIso); }
function dagIdxForStart(startDato, iso) {
    const w = weekdayIdx(iso);
    if (w >= 5) return null;
    return w < 4 ? w : 4 + rotWeekStart(startDato, mondayOf(iso));
}
function dagIdxFor(S, iso) { return dagIdxForStart(S.startDato, iso); }
let OPG_I_PLAN = false;
function setOpgIPlan(v) { OPG_I_PLAN = !!v; }
function idag() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ansættelsesgrad (timer pr. uge): feltet p.ansaet, ellers tallet i navnet (fx «Navn, 32»), ellers Timer */
function ansaetOf(p) {
    if (p.ansaet > 0) return +p.ansaet;
    const m = /,\s*(\d+(?:[.,]\d+)?)/.exec(p.navn || '');
    if (m) { const v = parseFloat(m[1].replace(',', '.')); if (v >= 5 && v <= 48) return v; }
    return +p.timer || 0;
}
const HELLIG_NAVN = { '01-01': 'Nyt\u00e5rsdag', '12-25': '1. juledag', '12-26': '2. juledag' };
function aarsInd(S) { return Object.assign({}, AARS_STD, S.aarsnorm || {}); }
/* navn p\u00e5 lukket dag (helligdag eller lukkedag), ellers null */
function lukketNavn(S, iso) {
    const A = S.aarsnorm || AARS_STD;
    if ((A.helligdage || []).includes(iso)) return HELLIG_NAVN[iso.slice(5)] || 'Helligdag';
    for (const l of A.lukkedage || []) if (l.fra <= iso && iso <= l.til) return l.navn || 'Lukket';
    return null;
}

/* ---------- grundplan-versioner: gamle uger ændres ikke, når grundplanen ændres ---------- */
function planVersion(S, iso) {
    if (!S.gyldigFra || iso >= S.gyldigFra) return null;       // nuværende grundplan
    const A = S.arkiv || [];
    for (const a of A) if (a.fra <= iso && iso <= a.til) return a;
    return A.length ? A[0] : null;
}
/* gem nuværende grundplan i arkivet og lad en ny version gælde fra dato */
function nyGrundplanFra(S, dato) {
    const fraNu = S.gyldigFra || '1900-01-01';
    if (dato <= fraNu) return 'Datoen skal v\u00e6re efter den nuv\u00e6rende grundplans startdato (' + fraNu + ').';
    const pers = {};
    S.personer.forEach(p => { pers[p.id] = { navn: p.navn, afd: p.afd, stue: p.stue, timer: p.timer, start: p.start.slice(), slut: p.slut.slice() }; });
    (S.arkiv = S.arkiv || []).push({ fra: fraNu, til: addDays(dato, -1), startDato: S.startDato, pers });
    S.arkiv.sort((a, b) => a.fra < b.fra ? -1 : 1);
    S.gyldigFra = dato;
    return null;
}


/* ---------- afspadsering: kort en vagt og oparbejd timerne andre dage ---------- */
function setOv(S, iso, pid, val) { (S.overstyr[iso] = S.overstyr[iso] || {})[pid] = val; }
function delOv(S, iso, pid) { if (S.overstyr[iso]) { delete S.overstyr[iso][pid]; if (!Object.keys(S.overstyr[iso]).length) delete S.overstyr[iso]; } }
function gemOv(S, iso, pid) { const o = S.overstyr[iso]; return o && Object.prototype.hasOwnProperty.call(o, pid) ? { har: true, v: o[pid] ? { s: o[pid].s, e: o[pid].e } : null } : { har: false }; }
function gendanOv(S, iso, pid, g) { if (!g || !g.har) delOv(S, iso, pid); else setOv(S, iso, pid, g.v); }
/* kort vagten med min minutter (placering slut/start) og mærk ændringen med tag. Returnerer {err} eller {orig} */
function kortVagt(S, p, iso, min, placering, tag) {
    const e = effInfo(S, p, iso);
    if (e.lukket) return { err: 'Dagen er lukket (' + e.lukket + ')' };
    if (e.abs) return { err: p.navn + ' har frav\u00e6r den dag' };
    if (!e.shift) return { err: p.navn + ' har ingen vagt den dag' };
    const len = e.shift[1] - e.shift[0];
    if (min >= len) return { err: 'Timerne er lige s\u00e5 lange som vagten (' + fmtDiff(len) + ' t) eller l\u00e6ngere' };
    const orig = gemOv(S, iso, p.id);
    setOv(S, iso, p.id, placering === 'start' ? { s: e.shift[0] + min, e: e.shift[1], a: tag } : { s: e.shift[0], e: e.shift[1] - min, a: tag });
    return { orig };
}
function oparbejdetMin(S, a) {
    return (a.oparb || []).reduce((t, o) => { const c = S.overstyr[o.iso] && S.overstyr[o.iso][a.personId]; return t + (c && c.a === a.id ? o.min : 0); }, 0);
}
/* foreslå hvordan timerne oparbejdes ved at forlænge vagter i starten eller slutningen af dagen, fordelt over ugerne */
function afspadForslag(S, a) {
    const p = S.personer.find(x => x.id === a.personId);
    if (!p) return { err: 'Personen findes ikke', forslag: [], behov: 0, mangler: 0 };
    const behov = Math.max(0, Math.round(a.timer * 60) - oparbejdetMin(S, a));
    const ind = indstFor(S), nu = idag(), step = a.step || 30, maxDag = a.maxDag || 60, uger = a.uger || 6, dir = a.retning === 'efter' ? 1 : -1;
    const grp = new Map();                                                   // mandag -> dage (nærmest datoen først)
    for (let n = 1; n <= uger * 7; n++) {
        const iso = addDays(a.dato, dir * n); if (weekdayIdx(iso) >= 5 || iso < nu) continue;
        const mon = mondayOf(iso); if (!grp.has(mon)) grp.set(mon, []); grp.get(mon).push(iso);
    }
    const pS = {}, pE = {}, tidl = {}; (a.oparb || []).forEach(o => { tidl[o.iso] = (tidl[o.iso] || 0) + o.min; });
    let tot = 0, sidste = 'slut';
    for (let pass = 0; pass < Math.ceil(maxDag / step) + 1 && tot < behov; pass++) {
        for (const [, dage] of grp) {
            if (tot >= behov) break;
            let bedst = null, bedstSum = 1e9;
            for (const iso of dage) {
                const e = effInfo(S, p, iso); if (!e.shift || e.abs || e.lukket) continue;
                const udv = (tidl[iso] || 0) + (pS[iso] || 0) + (pE[iso] || 0), m = Math.min(step, behov - tot);
                if (udv + m > maxDag) continue;
                const wd = weekdayIdx(iso), di = dagIdxFor(S, iso);
                for (const side of [sidste === 'slut' ? 'start' : 'slut', sidste]) {            // skift mellem ender, hvis begge kan
                    const ns = side === 'start' ? e.shift[0] - (pS[iso] || 0) - m : e.shift[0] - (pS[iso] || 0);
                    const ne = side === 'slut' ? e.shift[1] + (pE[iso] || 0) + m : e.shift[1] + (pE[iso] || 0);
                    if (ns < ind.aabnerUge[wd] || ne > ind.lukkerUge[wd]) continue;
                    if (ruleViolationsDate(S, p, iso, di, ns, ne).hard.length) continue;
                    if (udv < bedstSum) { bedst = { iso, m, side }; bedstSum = udv; }
                    break;
                }
            }
            if (bedst) { if (bedst.side === 'start') pS[bedst.iso] = (pS[bedst.iso] || 0) + bedst.m; else pE[bedst.iso] = (pE[bedst.iso] || 0) + bedst.m; tot += bedst.m; sidste = bedst.side; }
        }
    }
    const dageSet = [...new Set([...Object.keys(pS), ...Object.keys(pE)])].sort();
    const forslag = dageSet.map(iso => { const e = effInfo(S, p, iso).shift; return { iso, minS: pS[iso] || 0, minE: pE[iso] || 0, min: (pS[iso] || 0) + (pE[iso] || 0), s: e[0] - (pS[iso] || 0), e: e[1] + (pE[iso] || 0), foerS: e[0], foerE: e[1] }; });
    return { forslag, behov, mangler: behov - tot };
}
function afspadAnvend(S, a, forslag) {
    const p = S.personer.find(x => x.id === a.personId); if (!p) return;
    for (const f of forslag) {
        const e = effInfo(S, p, f.iso).shift; if (!e) continue;
        const g = gemOv(S, f.iso, p.id);
        setOv(S, f.iso, p.id, { s: e[0] - (f.minS || 0), e: e[1] + (f.minE != null ? f.minE : f.min), a: a.id });
        (a.oparb = a.oparb || []).push({ iso: f.iso, min: f.min, orig: g });
    }
}
function afspadFjern(S, a) {
    const pid = a.personId;
    (a.oparb || []).slice().reverse().forEach(o => { const c = S.overstyr[o.iso] && S.overstyr[o.iso][pid]; if (c && c.a === a.id) gendanOv(S, o.iso, pid, o.orig); });
    const c = S.overstyr[a.dato] && S.overstyr[a.dato][pid]; if (c && c.a === a.id) gendanOv(S, a.dato, pid, a.dagOrig);
    S.afspad = (S.afspad || []).filter(x => x.id !== a.id);
}

/* ---------- opgaver (personalem\u00f8de, stuem\u00f8der m.m.) ---------- */
const FREK = { uge: 'pr. uge', '4uger': 'pr. 4. uge', maaned: 'pr. m\u00e5ned', aar: 'pr. \u00e5r', engang: 'engangs (dato)' };

/* ---------- personer ---------- */

/* ---------- hensyn ---------- */

}
function hensynKort(S, h) {

}

}
function dageTekst(dage) {

}
function memberOf(rule, p) {

}

    const dg = ruleDage(rule), alle = dg.length === 8, mt = dg.length === 4 && dg.join() === '0,1,2,3';
    return (rule.stue || (rule.afd === '*' ? 'Begge afdelinger' : 'Hele afdelingen ' + rule.afd)) + ' ' + fmtT(rule.fra) + '-' + fmtT(rule.til) + ': mindst ' + rule.min + (rule.kval ? ' ' + rule.kval.toLowerCase() : '') + (alle ? '' : ' (' + (mt ? 'man-tors' : dageTekst(dg)) + ')');

/* items: [{label, get:(p)=>[s,e]|null}] -> sammenhængende huller */

    const issues = [];
    for (const rule of S.hensyn.bemanding) {

        const mem = S.personer.filter(p => memberOf(rule, p));
        const slots = ruleSlots(rule);
        const dg = ruleDage(rule);
        items.forEach((it, di) => {
            if (it.lukket) return;

            if (items.length !== 8 && !dg.includes(it.dagIdx)) return;
            let cur = null;
            for (const m of slots) {
                let cnt = 0;

                    else { cur = { rule, day: di, label: it.label, from: m, to: m + SLOT_TRIN, worst: cnt }; issues.push(cur); }

}
function issueTekst(is) {
    return is.label + ' · ' + (is.rule.stue || (is.rule.afd === '*' ? 'Begge afdelinger' : 'Hele afdelingen')) + ' ' + fmtT(is.from) + '-' + fmtT(is.to) + ': ' + is.worst + ' af ' + is.rule.min + (is.rule.kval ? ' ' + is.rule.kval.toLowerCase() : '') + (is.rule.hard === 'skal' ? '' : ' (gerne)');
}

            for (const r of S.hensyn.bemanding) {

/* ---------- ugeplan ---------- */
function findAbs(S, pid, iso) {

    return null;
}

    const ver = planVersion(S, iso);

    return t;
}

function findAfloeser(S, absentP, iso) {
    const info = effInfo(S, absentP, iso);
    const need = info.need;
    if (!need) return { need: null, list: [] };
    const di = dagIdxFor(S, iso), monday = mondayOf(iso), dur = need[1] - need[0];
    const list = [];
    for (const q of S.personer) {
        if (q.id === absentP.id || !(q.timer > 0) || q.auto === false || q.afd !== absentP.afd) continue;
        const qi = effInfo(S, q, iso);
        if (qi.abs || qi.shift) continue;
        const v = ruleViolationsDate(S, q, iso, di, need[0], need[1]);
        if (v.hard.length) continue;
        // 11 timers hvile
        const pd = effInfo(S, q, addDays(iso, -1)).shift, nd = effInfo(S, q, addDays(iso, 1)).shift;
        if (weekdayIdx(iso) > 0 && pd && need[0] + 1440 - pd[1] < MIN_HVILE) continue;
        if (weekdayIdx(iso) < 4 && nd && nd[0] + 1440 - need[1] < MIN_HVILE) continue;
        const wk = weekMinutes(S, q, monday), norm = Math.round(q.timer * 60);
        const owed = norm - wk, after = wk + dur, over = Math.max(0, after - norm);
        let score = Math.min(Math.max(owed, 0), dur) / 3 - over / 3 + (q.stue === absentP.stue ? 25 : 0) + (q.afd === absentP.afd ? 15 : 0)
            + (absentP.kval && q.kval === absentP.kval ? 10 : 0) - 40 * v.soft.length;
        const why = [];
        why.push(owed > 0 ? 'mangler ' + fmtDiff(owed) + ' t i ugen' : 'har allerede fuld uge');
        if (over > 0) why.push('giver ' + fmtDiff(over) + ' t ekstra');
        if (q.stue === absentP.stue) why.push('samme stue'); else why.push('stue: ' + q.stue + (q.afd !== absentP.afd ? ' (' + q.afd + ')' : ''));
        if (absentP.kval && q.kval === absentP.kval) why.push(q.kval.toLowerCase());
        for (const h of v.soft) why.push('bryder ønske: ' + hensynKort(S, h));
        list.push({ p: q, score, why, wk, norm });

/* ---------- autogenerering (simuleret afkøling) ---------- */

function solve(S, opts) {

    const rnd = mulberry32(opts.seed);
    const P = S.personer, n = P.length;
    const cur = P.map(p => Array.from({ length: 8 }, (_, d) => getBase(p, d)));
    const orig = cur.map(a => a.map(x => x ? x.slice() : null));
    const free = P.map(() => Array(8).fill(false));
    P.forEach((p, i) => {

        } else if (t.has && t.mt > 0 && t.diff !== 0) {

        }

    /* kandidatvagter */
    const startSet = new Set(), endSet = new Set(), STD = new Set();
    P.forEach((p, i) => { for (let d = 0; d < 8; d++) if (!free[i][d] && cur[i][d]) { startSet.add(cur[i][d][0]); endSet.add(cur[i][d][1]); STD.add(cur[i][d][0] * 10000 + cur[i][d][1]); } });
    P.forEach(p => { for (let d = 0; d < 8; d++) if (p.start[d] != null) { startSet.add(p.start[d]); endSet.add(p.slut[d]); STD.add(p.start[d] * 10000 + p.slut[d]); } });

function farveKort(afd) { const m = {}; unikVagter(S, afd).forEach((v, i) => { m[v[0] * 10000 + v[1]] = vagtFarve(i); }); return m; }

            inp.classList.toggle('fs', !!(p.forslag && p.forslag[d]));
            const v = p.start[d] != null ? ruleViolations(S, p, d, p.start[d], p.slut[d]) : { hard: [], soft: [] };
            inp.classList.toggle('viol', v.hard.length > 0); inp.classList.toggle('soft', !v.hard.length && v.soft.length > 0);
            inp.title = [...v.hard.map(h => 'SKAL brudt: ' + hensynTekst(S, h)), ...v.soft.map(h => 'Ønske brudt: ' + hensynTekst(S, h))].join('\n');

function tjekTabel(afd, d1, d2, titel, fk) {
    const vs = new Map();
    for (const p of S.personer) if (p.afd === afd) for (let d = d1; d < d2; d++) if (p.start[d] != null) {
        const k = p.start[d] * 10000 + p.slut[d]; if (!vs.has(k)) vs.set(k, Array(d2 - d1).fill(0)); vs.get(k)[d - d1]++;
    }
    const keys = [...vs.keys()].sort((a, b) => a - b);
    const ens = keys.every(k => new Set(vs.get(k)).size === 1);
    let h = '<div><h4>' + titel + '</h4><div class="' + (ens ? 'good' : 'bad') + ' b">' + (ens ? '✔ Samme vagter alle dage' : '✘ Ikke ens – afvigelser er markeret') + '</div><table class="mini"><thead><tr><th>Vagt</th>' + DAG_KORT.slice(d1, d2).map(x => '<th>' + x + '</th>').join('') + '<th>Timer</th></tr></thead><tbody>';
    for (const k of keys) {
        const c = vs.get(k), ok = new Set(c).size === 1, s = Math.floor(k / 10000), e = k % 10000;
        h += '<tr class="' + (ok ? '' : 'uens') + '"><td style="background:' + fk[k] + '">' + fmtVagt(s, e) + '</td>' + c.map(x => '<td class="ctr">' + x + '</td>').join('') + '<td class="ctr">' + fmtDiff(e - s) + '</td></tr>';
    }
    return h + '</tbody></table></div>';
}
function dækTabel(afd, stue) {

const MND = ['Sep', 'Okt', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'Maj', 'Jun', 'Jul', 'Aug'];
function restTxt(p, y, r) {
    const nu = todayISO(), start = y + '-09-01', end = (y + 1) + '-08-31';
    if (nu < start || nu > end) return '';
    let n = 0; for (let mon = addDays(mondayOf(nu), 7); mon <= end; mon = addDays(mon, 7)) if (erArbejdsuge(S, p, mon)) n++;
    if (!n) return '';
    const v = r.diff / 60 / n; return (v > 0 ? '+' : '') + fmtTim(v) + ' t';
}

            if (!/^\d{4}-\d{2}-\d{2}$/.test(dt) || isNaN(parseISO(dt))) { toast('Skriv datoen som \u00e5\u00e5\u00e5\u00e5-mm-dd', true); break; }
            snapshot(); const err = nyGrundplanFra(S, dt);
            if (err) { undoStack.pop(); toast(err, true); break; }
            logg('Ny grundplan g\u00e6lder fra ' + dt); commit(); render(); toast('Ny grundplan g\u00e6lder fra ' + fmtDKY(dt) + '. Ret den nu, uden at gamle uger \u00e6ndres.'); break;

            logg('Opgave \u00ab' + navn + '\u00bb (' + String(tim).replace('.', ',') + ' t ' + FREK[fr] + ') tilf\u00f8jet til ' + mal.length + ' person(er)'); commit(); render(); toast('Opgaven er tilf\u00f8jet til ' + mal.length + ' person(er)'); break;
